<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<meta name="description" content="My Portfolio Site.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap" rel="stylesheet">
<link href="output.css" rel="stylesheet">
<style>
:root{--ease:cubic-bezier(.2,0,0,1);--spring:cubic-bezier(.34,1.56,.64,1);--e1:0 1px 2px rgba(0,0,0,.2),0 1px 3px 1px rgba(0,0,0,.1);--e3:0 1px 3px rgba(0,0,0,.2),0 6px 12px 4px rgba(0,0,0,.12);--surface:#fdf8ff;--on-surface:#1d1b20;--on-surface-variant:#49454f;--sc-low:#f7f2fa;--sc:#f1ecf4;--sc-high:#ebe6ee;--sc-highest:#e5e0e8;--primary:#5a3ec8;--on-primary:#fff;--primary-c:#e5deff;--on-primary-c:#1a0c63;--secondary-c:#d4f0b0;--on-secondary-c:#0c2000;--tertiary-c:#ffd9e0;--on-tertiary-c:#3e001d;--outline-v:#cac4d0}
@media (prefers-color-scheme:dark){:root{--surface:#141218;--on-surface:#e6e0e9;--on-surface-variant:#cac4d0;--sc-low:#1d1b20;--sc:#211f26;--sc-high:#2b2930;--sc-highest:#36343b;--primary:#cabeff;--on-primary:#2f1a8f;--primary-c:#46309f;--on-primary-c:#e5deff;--secondary-c:#3a4d1f;--on-secondary-c:#d4f0b0;--tertiary-c:#7a2346;--on-tertiary-c:#ffd9e0;--outline-v:#49454f}}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--surface);color:var(--on-surface);-webkit-font-smoothing:antialiased;padding-bottom:7rem;transition:padding-bottom .6s var(--ease),background-color .4s var(--ease),color .4s var(--ease)}
body.locked{overflow:hidden}
section{scroll-margin-top:6rem}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
.ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;line-height:1;display:inline-block;font-size:24px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;background:#000;transition:opacity .7s var(--ease),transform .7s var(--ease),visibility 0s linear .7s}
#splash.out{opacity:0;transform:scale(1.06);visibility:hidden}
.sp-shape{width:96px;height:96px;background:#cabeff}
@keyframes rise{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes morph{0%,100%{border-radius:42% 58% 63% 37%/45% 40% 60% 55%}50%{border-radius:58% 42% 38% 62%/55% 60% 40% 45%}}
.stretch{font-family:'Roboto Flex','Plus Jakarta Sans',system-ui,sans-serif;font-size:clamp(2.5rem,8.5vw,6rem);font-stretch:151%;font-variation-settings:'wdth' 151,'wght' 850,'opsz' 144}
.hi{opacity:0}
.ready .hi{animation:rise .9s var(--ease) calc(var(--i,0)*.1s) forwards}
.ready .pop{animation-name:pop;animation-timing-function:var(--spring)}
.blob{animation:morph 10s ease-in-out infinite}
.blob2{animation:morph 7s ease-in-out infinite reverse}
.blob3{animation:morph 8s ease-in-out -2s infinite}
.bar{background:color-mix(in srgb,var(--sc-high) 84%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--e1)}
.navlink{padding:.5rem 1rem;border-radius:9999px;font-weight:600;font-size:.875rem;color:var(--on-surface-variant);transition:background-color .25s var(--ease),color .25s var(--ease)}
.navlink:hover{background:var(--sc-highest)}
.navlink.on{background:var(--secondary-c);color:var(--on-secondary-c)}
.bn{display:flex;flex-direction:column;align-items:center;gap:.25rem;min-width:3.5rem;font-size:11px;font-weight:600;color:var(--on-surface-variant)}
.pill{display:grid;place-items:center;width:4rem;height:2.75rem;border-radius:9999px;transition:background-color .3s var(--ease)}
.bn.on{color:var(--on-surface)}
.bn.on .pill{background:var(--secondary-c);color:var(--on-secondary-c)}
.bn.on .ms{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;height:3rem;padding:0 1.5rem;border-radius:9999px;font-weight:700;transition:border-radius .4s var(--spring),transform .4s var(--spring),box-shadow .3s var(--ease),filter .2s}
.btn:hover{box-shadow:var(--e1);filter:brightness(1.06)}
.btn:active{border-radius:14px;transform:scale(.96)}
.rv{opacity:0;transform:translateY(24px) scale(.98);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}
.dn{max-width:0;opacity:0;overflow:hidden;visibility:hidden;white-space:nowrap;transform:translateY(-6px) scale(.96);transition:max-width .6s var(--ease),opacity .4s var(--ease),transform .6s var(--ease),visibility 0s linear .6s}
.bb{transition:transform .6s var(--ease),opacity .4s var(--ease),visibility 0s}
@media (min-width:768px){
.dn{max-width:32rem;opacity:1;visibility:visible;transform:none;transition:max-width .6s var(--ease),opacity .4s var(--ease) .1s,transform .6s var(--ease),visibility 0s}
.bb{transform:translateY(160%);opacity:0;visibility:hidden;transition:transform .6s var(--ease),opacity .4s var(--ease),visibility 0s linear .6s}
body{padding-bottom:0}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body class="font-sans">

<div id="splash" role="status" aria-label="Loading"><div class="sp-shape"></div></div>

<header class="bar fixed inset-x-3 top-3 z-50 mx-auto hidden max-w-5xl md:flex items-center justify-between rounded-full px-5 py-3 md:top-4">
  <a href="#hero" class="text-lg font-extrabold tracking-tight">Bonfales</a>
  <nav class="dn flex gap-1" aria-label="Primary">
    <a href="#about" data-nav="about" class="navlink">About</a>
    <a href="#Social media" data-nav="Social media" class="navlink">Social media</a>
  </nav>
</header>

<nav class="bar bb fixed inset-x-3 bottom-3 z-50 flex justify-around rounded-[28px] py-2" aria-label="Sections">
  <a href="#hero" data-nav="hero" class="bn on" aria-label="Home"><span class="pill"><span class="ms">home</span></span></a>
  <a href="#about" data-nav="about" class="bn" aria-label="About"><span class="pill"><span class="ms">person</span></span></a>
  <a href="#Social media" data-nav="Social media" class="bn" aria-label="Social media"><span class="pill"><span class="ms">alternate_email</span></span></a>
</nav>

<main>
  <section id="hero" class="mx-auto grid min-h-[100svh] max-w-6xl items-center gap-10 px-5 pb-16 pt-28 lg:grid-cols-[1.5fr_1fr]">
    <div>
      <h1 class="hi stretch leading-[.95] tracking-[-0.04em]">Hi, I’m<br>Bonfales.</h1>
      <p class="hi mt-6 max-w-xl text-lg text-on-surface-variant md:text-xl" style="--i:1">I make contents on YouTube.</p>
      <div class="hi mt-9 flex flex-wrap gap-3" style="--i:2">
        <a href="#Social media" class="btn bg-primary text-on-primary">Social media</a>
      </div>
    </div>
    <div class="hi pop relative mx-auto aspect-square w-full max-w-[18rem] lg:max-w-[26rem]" style="--i:1" aria-hidden="true">
      <div class="blob absolute inset-[8%] grid place-items-center bg-primary text-on-primary"><span class="ms" style="font-size:clamp(4.5rem,14vw,8rem)">code</span></div>
      <div class="blob2 absolute right-0 top-0 aspect-square w-[34%] bg-secondary-c"></div>
      <div class="blob3 absolute bottom-0 left-0 aspect-square w-[30%] bg-tertiary-c"></div>
    </div>
  </section>

  <section id="about" class="mx-auto max-w-6xl px-5 py-20 md:py-28">
    <div class="grid gap-5">
      <div class="rv rounded-[28px] bg-primary-c p-8 text-on-primary-c md:p-12">
        <h2 class="text-4xl font-extrabold tracking-tight md:text-6xl">About me</h2>
        <p class="mt-6 max-w-prose text-lg leading-relaxed">I couldn't think of what to write here.</p>
      </div>
    </div>
  </section>

  <section id="Social media" class="mx-auto max-w-6xl px-5 py-20 md:py-28">
    <div class="rv rounded-[40px] bg-primary p-8 text-on-primary md:p-16">
      <h2 class="text-4xl font-extrabold tracking-tight md:text-7xl">Social media</h2>
      <p class="mt-5 max-w-xl text-lg md:text-xl">Follow me!</p>
      <div class="mt-9 flex flex-wrap gap-3">
        <a href="https://x.com/bonfales" target="_blank" rel="noopener noreferrer" class="btn bg-primary-c text-on-primary-c">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          X (Twitter)
        </a>
        <a href="https://www.youtube.com/@bonfales" target="_blank" rel="noopener noreferrer" class="btn bg-secondary-c text-on-secondary-c">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor" aria-hidden="true"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
          YouTube
        </a>
        <a href="https://github.com/Bonfales12345" target="_blank" rel="noopener noreferrer" class="btn bg-tertiary-c text-on-tertiary-c">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.921.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
          GitHub
        </a>
      </div>
    </div>
  </section>
</main>


<script>
const $=(s,c=document)=>c.querySelector(s),$$=(s,c=document)=>[...c.querySelectorAll(s)];
const body=document.body;
body.classList.add('locked');
const pts=f=>'polygon('+Array.from({length:48},(_,i)=>{const t=i/48*Math.PI*2,r=f(t);return(50+50*r*Math.cos(t)).toFixed(1)+'% '+(50+50*r*Math.sin(t)).toFixed(1)+'%'}).join(',')+')';
const lobe=(n,a)=>t=>(1+a*Math.cos(n*t))/(1+a);
const squircle=t=>Math.pow(Math.pow(Math.abs(Math.cos(t)),4)+Math.pow(Math.abs(Math.sin(t)),4),-.25);
const shapes=[['#cabeff',lobe(1,0)],['#d4f0b0',lobe(6,.14)],['#ffb1c6',lobe(3,.2)],['#cabeff',squircle],['#d4f0b0',lobe(9,.07)],['#ffb1c6',lobe(4,.16)],['#cabeff',lobe(5,.12)],['#d4f0b0',lobe(1,0)]];

$('.sp-shape').animate(shapes.map(([c,f],i)=>({clipPath:pts(f),backgroundColor:c,transform:'rotate('+i*50+'deg)',easing:'cubic-bezier(.2,0,0,1)'})),{duration:2000,iterations:Infinity,direction:'alternate'});

let finished=false;
const finish=()=>{
  if(finished)return;
  finished=true;
  const s=$('#splash');
  s.classList.add('out');
  body.classList.remove('locked');
  body.classList.add('ready');
  setTimeout(()=>s.remove(),900);
};

const pageLoaded=new Promise(res=>{
  if(document.readyState==='complete')res();
  else addEventListener('load',res,{once:true});
});
const fontsLoaded=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();
Promise.all([pageLoaded,fontsLoaded]).then(finish);
setTimeout(finish,15000);


const reveal=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');reveal.unobserve(e.target)}}),{threshold:.12});
$$('.rv').forEach(el=>reveal.observe(el));

const spy=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){$$('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===e.target.id))}
}),{rootMargin:'-45% 0px -50% 0px'});
$$('main section').forEach(s=>spy.observe(s));


(()=>{
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  let target=scrollY,cur=scrollY,raf=0;
  const max=()=>document.documentElement.scrollHeight-innerHeight;
  const clamp=v=>Math.max(0,Math.min(max(),v));
  const tick=()=>{
    cur+=(target-cur)*.09;
    if(Math.abs(target-cur)<.4){cur=target;raf=0}
    scrollTo(0,cur);
    if(raf)raf=requestAnimationFrame(tick);
  };
  const go=()=>{if(!raf)raf=requestAnimationFrame(tick)};
  addEventListener('wheel',e=>{
    if(e.ctrlKey||body.classList.contains('locked'))return;
    e.preventDefault();
    if(!raf)cur=target=scrollY;
    const d=e.deltaMode===1?e.deltaY*32:e.deltaMode===2?e.deltaY*innerHeight:e.deltaY;
    target=clamp(target+d);
    go();
  },{passive:false});
  addEventListener('scroll',()=>{
    if(Math.abs(scrollY-cur)>3){cancelAnimationFrame(raf);raf=0;cur=target=scrollY}
  },{passive:true});
  $$('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{
    const el=$(a.getAttribute('href'));
    if(!el)return;
    e.preventDefault();
    cur=scrollY;
    target=clamp(a.getAttribute('href')==='#hero'?0:el.getBoundingClientRect().top+scrollY-96);
    go();
  }));
})();
</script>
</body>
</html>
